services:
  - type: web
    name: onehope-resource-centre
    runtime: python
    rootDir: onehope-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false        # you set this in Render dashboard
      - key: DRIVE_FOLDER_ID
        sync: false        # the Drive folder that holds the resources
      - key: DATABASE_URL
        sync: false        # free Neon/Supabase Postgres connection string
      - key: SHEET_CSV_URL
        sync: false        # optional: extra details from the resource sheet
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_DOMAIN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
